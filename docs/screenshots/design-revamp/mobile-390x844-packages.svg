<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#F4F6F8" />

  <!-- App Header -->
  <rect width="390" height="60" fill="#F4F6F8" />
  <line x1="0" y1="60" x2="390" y2="60" stroke="#E3E8EE" stroke-width="1" />
  <circle cx="34" cy="30" r="16" fill="#0B1220" />
  <text x="60" y="27" font-family="'Readex Pro', sans-serif" font-size="15" font-weight="700" fill="#0B1220">طلقة نت</text>
  <text x="60" y="42" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10" fill="#5B6676">ستارلينك مأرب</text>

  <!-- Page Title -->
  <text x="16" y="90" font-family="'Readex Pro', sans-serif" font-size="18" font-weight="700" fill="#0B1220">باقات وكروت طلقة نت</text>
  <text x="16" y="106" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" fill="#5B6676">فئات مدروسة للتصفح، الألعاب، وبث الفيديو</text>

  <!-- Filter Chips (Capsules) -->
  <rect x="16" y="122" width="56" height="28" rx="14" fill="#0B1220" />
  <text x="44" y="140.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">الكل</text>
  <rect x="78" y="122" width="70" height="28" rx="14" fill="#FFFFFF" stroke="#E3E8EE" />
  <text x="113" y="140.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" fill="#5B6676" text-anchor="middle">الساعات</text>
  <rect x="154" y="122" width="68" height="28" rx="14" fill="#FFFFFF" stroke="#E3E8EE" />
  <text x="188" y="140.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" fill="#5B6676" text-anchor="middle">اليومية</text>
  <rect x="228" y="122" width="76" height="28" rx="14" fill="#FFFFFF" stroke="#E3E8EE" />
  <text x="266" y="140.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" fill="#5B6676" text-anchor="middle">الأسبوعية</text>

  <!-- Card 500 (Featured: slim signal border, NO gradient!) -->
  <rect x="16" y="162" width="358" height="200" rx="24" fill="#FFFFFF" stroke="#C6F24E" stroke-width="2.5" />
  <!-- Category & Badge -->
  <text x="32" y="186" font-family="'Readex Pro', sans-serif" font-size="11" font-weight="600" fill="#5B6676">يومي واقتصادي</text>
  <rect x="290" y="174" width="70" height="20" rx="10" fill="#C6F24E" />
  <text x="325" y="188" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10" font-weight="700" fill="#0B1220" text-anchor="middle">الأكثر طلباً</text>

  <!-- Big Price in Readex Pro -->
  <text x="32" y="222" font-family="'Readex Pro', sans-serif" font-size="34" font-weight="600" fill="#0B1220">500</text>
  <text x="100" y="218" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" fill="#5B6676">ريال يمني</text>

  <!-- Capacity Bar -->
  <text x="32" y="244" font-family="'Readex Pro', sans-serif" font-size="12" font-weight="600" fill="#0B1220">2700 ميجابايت (2.7GB)</text>
  <rect x="32" y="250" width="326" height="5" rx="2.5" fill="#F4F6F8" />
  <rect x="32" y="250" width="145" height="5" rx="2.5" fill="#7EC400" />

  <!-- Specs row -->
  <line x1="32" y1="272" x2="358" y2="272" stroke="#E3E8EE" stroke-width="1" />
  <text x="32" y="292" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" fill="#5B6676">🕒 15 ساعة</text>
  <text x="160" y="292" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" fill="#5B6676">📅 10 أيام</text>
  <text x="358" y="292" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" fill="#5B6676" text-anchor="end">📶 حتى 50 Mbps</text>
  <text x="358" y="342" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="end">التفاصيل والشراء ←</text>

  <!-- Card 1000 -->
  <rect x="16" y="374" width="358" height="200" rx="24" fill="#FFFFFF" stroke="#E3E8EE" />
  <text x="32" y="398" font-family="'Readex Pro', sans-serif" font-size="11" font-weight="600" fill="#5B6676">أسبوعي ومكثف</text>
  <text x="32" y="434" font-family="'Readex Pro', sans-serif" font-size="34" font-weight="600" fill="#0B1220">1000</text>
  <text x="120" y="430" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" fill="#5B6676">ريال يمني</text>

  <text x="32" y="456" font-family="'Readex Pro', sans-serif" font-size="12" font-weight="600" fill="#0B1220">4500 ميجابايت (4.5GB)</text>
  <rect x="32" y="462" width="326" height="5" rx="2.5" fill="#F4F6F8" />
  <rect x="32" y="462" width="210" height="5" rx="2.5" fill="#0B1220" />

  <line x1="32" y1="484" x2="358" y2="484" stroke="#E3E8EE" stroke-width="1" />
  <text x="32" y="504" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" fill="#5B6676">🕒 30 ساعة</text>
  <text x="160" y="504" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" fill="#5B6676">📅 10 أيام</text>
  <text x="358" y="504" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" fill="#5B6676" text-anchor="end">📶 حتى 70 Mbps</text>
  <text x="358" y="554" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="end">التفاصيل والشراء ←</text>

  <!-- Floating Nav (Tab 2 Active: الباقات) -->
  <rect x="35" y="768" width="320" height="50" rx="25" fill="#FFFFFF" stroke="#E3E8EE" filter="drop-shadow(0 12px 24px rgba(11,18,32,0.12))" />
  <text x="60" y="798" font-family="sans-serif" font-size="16" fill="#5B6676" text-anchor="middle">⌂</text>
  <rect x="92" y="773" width="85" height="40" rx="20" fill="#C6F24E" />
  <text x="134" y="798" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">☷ الباقات</text>
  <text x="217" y="798" font-family="sans-serif" font-size="16" fill="#5B6676" text-anchor="middle">▶</text>
  <text x="272" y="798" font-family="sans-serif" font-size="16" fill="#5B6676" text-anchor="middle">⬚</text>
  <text x="325" y="798" font-family="sans-serif" font-size="16" fill="#5B6676" text-anchor="middle">⋯</text>
</svg>
