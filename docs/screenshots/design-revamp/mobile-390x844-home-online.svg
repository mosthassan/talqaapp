<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Orbit Background -->
  <rect width="390" height="844" fill="#F4F6F8" />

  <!-- App Header -->
  <rect width="390" height="60" fill="#F4F6F8" />
  <line x1="0" y1="60" x2="390" y2="60" stroke="#E3E8EE" stroke-width="1" />

  <!-- Logo (Ink circle + white glyph) -->
  <circle cx="34" cy="30" r="16" fill="#0B1220" />
  <circle cx="42" cy="24" r="2.5" fill="#C6F24E" />
  <!-- Title & Status -->
  <text x="60" y="27" font-family="'Readex Pro', sans-serif" font-size="15" font-weight="700" fill="#0B1220">طلقة نت</text>
  <rect x="118" y="16" width="56" height="20" rx="10" fill="#FFFFFF" stroke="#E3E8EE" />
  <circle cx="126" cy="26" r="3" fill="#7EC400" />
  <text x="134" y="29.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" fill="#5B6676" font-weight="500">متصل</text>
  <text x="60" y="42" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10" fill="#5B6676">ستارلينك مأرب</text>

  <!-- t.net pill button -->
  <rect x="306" y="17" width="68" height="26" rx="13" fill="#FFFFFF" stroke="#E3E8EE" />
  <text x="334" y="34" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" font-weight="500" fill="#0B1220" text-anchor="middle">t.net ↗</text>

  <!-- Hero: SignalRing Card (32px radius) -->
  <rect x="16" y="74" width="358" height="250" rx="32" fill="#FFFFFF" stroke="#E3E8EE" />
  <!-- Orbit Ring Glow -->
  <circle cx="195" cy="180" r="70" fill="rgba(198, 242, 78, 0.18)" />
  <!-- SVG Track -->
  <circle cx="195" cy="180" r="62" stroke="#E3E8EE" stroke-width="9" fill="none" />
  <!-- SVG Arc in Lime Signal -->
  <circle cx="195" cy="180" r="62" stroke="#C6F24E" stroke-width="9" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="130" fill="none" transform="rotate(-90 195 180)" />

  <!-- Value in Ring Center -->
  <text x="195" y="164" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" fill="#5B6676" text-anchor="middle">زمن الاستجابة</text>
  <text x="185" y="196" font-family="'Readex Pro', sans-serif" font-size="34" font-weight="600" fill="#0B1220" text-anchor="middle">38</text>
  <text x="214" y="193" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" fill="#5B6676">ms</text>
  <rect x="150" y="206" width="90" height="18" rx="9" fill="#EEF9CF" />
  <text x="195" y="218.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10" font-weight="600" fill="#0B1220" text-anchor="middle">فحص فعلي حقيقي</text>

  <!-- Button below ring -->
  <rect x="100" y="278" width="190" height="34" rx="17" fill="#0B1220" />
  <text x="195" y="299.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">إعادة الفحص</text>

  <!-- Primary Ink Button: ادخل إلى الإنترنت -->
  <rect x="16" y="338" width="358" height="50" rx="25" fill="#0B1220" />
  <circle cx="44" cy="363" r="11" fill="#1E293B" />
  <text x="64" y="369" font-family="'Readex Pro', sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF">ادخل إلى الإنترنت</text>
  <text x="340" y="369" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11.5" fill="#C6F24E" text-anchor="end">t.net ↗</text>

  <!-- Secondary Button: اعرف رصيد كرتك + Info icon -->
  <rect x="16" y="396" width="308" height="42" rx="21" fill="#FFFFFF" stroke="#E3E8EE" />
  <text x="170" y="422.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" font-weight="600" fill="#0B1220" text-anchor="middle">اعرف رصيد كرتك ↗</text>
  <circle cx="351" cy="417" r="18" fill="#FFFFFF" stroke="#E3E8EE" />
  <text x="351" y="422" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="13" font-weight="bold" fill="#5B6676" text-anchor="middle">ℹ</text>

  <!-- Compact Notice Bar -->
  <rect x="16" y="446" width="358" height="26" rx="13" fill="#F4F6F8" stroke="#E3E8EE" />
  <text x="30" y="463" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" fill="#5B6676">بوابة الدخول وفحص الرصيد تعمل داخل واي فاي طلقة نت</text>
  <text x="355" y="463" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" font-weight="600" fill="#0B1220" text-anchor="end">تفاصيل</text>

  <!-- Bento Grid (Varied sizes) -->
  <!-- Card 1: مسابقة الانتماء (Signal Soft background) -->
  <rect x="16" y="482" width="173" height="136" rx="24" fill="#EEF9CF" stroke="#DEEDB5" />
  <rect x="28" y="494" width="50" height="18" rx="9" fill="#FFFFFF" opacity="0.8" />
  <text x="53" y="506.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="middle">المرحلة 3</text>
  <text x="28" y="534" font-family="'Readex Pro', sans-serif" font-size="13" font-weight="700" fill="#0B1220">مسابقة الانتماء</text>
  <text x="28" y="552" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10" fill="#0B1220" opacity="0.75">10 كروت ← عجلة الحظ</text>
  <!-- 10 dots -->
  <g transform="translate(28, 590)">
    <circle cx="5" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
    <circle cx="15" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
    <circle cx="25" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
    <circle cx="35" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
    <circle cx="45" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
    <circle cx="55" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
    <circle cx="65" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
    <circle cx="75" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
    <circle cx="85" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
    <circle cx="95" cy="0" r="3" fill="#FFFFFF" stroke="#0B1220" stroke-width="1" />
  </g>

  <!-- Card 2: بث المباريات (Sky background) -->
  <rect x="201" y="482" width="173" height="136" rx="24" fill="#E6EEFB" stroke="#D5E2F6" />
  <rect x="213" y="494" width="60" height="18" rx="9" fill="#FFFFFF" opacity="0.8" />
  <circle cx="221" cy="503" r="2.5" fill="#E5484D" />
  <text x="247" y="506.5" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="9.5" font-weight="600" fill="#0B1220" text-anchor="middle">مباشر LAN</text>
  <text x="213" y="534" font-family="'Readex Pro', sans-serif" font-size="13" font-weight="700" fill="#0B1220">بث المباريات</text>
  <text x="213" y="552" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10" fill="#5B6676">قنوات HLS المحلية</text>
  <text x="213" y="594" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="10.5" font-weight="600" fill="#0B1220">جدول القنوات ←</text>

  <!-- Single-Line Announcement -->
  <rect x="16" y="628" width="358" height="40" rx="20" fill="#FFFFFF" stroke="#E3E8EE" />
  <circle cx="32" cy="648" r="3.5" fill="#7EC400" />
  <text x="44" y="652" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" fill="#0B1220">استقرار كامل وسرعات متوازنة عبر محطة ستارلينك</text>
  <text x="355" y="652" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11" font-weight="600" fill="#0B1220" text-anchor="end">الباقات ←</text>

  <!-- Floating Pill Bottom Navigation (Active tab expands with Lime Signal pill) -->
  <rect x="35" y="768" width="320" height="50" rx="25" fill="#FFFFFF" stroke="#E3E8EE" filter="drop-shadow(0 12px 24px rgba(11,18,32,0.12))" />
  <!-- Active Tab: الرئيسية (Capsule expanded in Signal Lime) -->
  <rect x="42" y="773" width="90" height="40" rx="20" fill="#C6F24E" />
  <text x="87" y="798" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">⌂ الرئيسية</text>
  <!-- Inactive tabs: icons only -->
  <text x="162" y="798" font-family="sans-serif" font-size="16" fill="#5B6676" text-anchor="middle">☷</text>
  <text x="217" y="798" font-family="sans-serif" font-size="16" fill="#5B6676" text-anchor="middle">▶</text>
  <text x="272" y="798" font-family="sans-serif" font-size="16" fill="#5B6676" text-anchor="middle">⬚</text>
  <text x="325" y="798" font-family="sans-serif" font-size="16" fill="#5B6676" text-anchor="middle">⋯</text>
</svg>
