<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <rect width="400" height="800" fill="#f8fafc" />
  <!-- Header -->
  <rect width="400" height="64" fill="#ffffff" />
  <rect x="0" y="63" width="400" height="1" fill="#e2e8f0" />
  <circle cx="40" cy="32" r="18" fill="#2563eb" />
  <text x="70" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">طلقة نت</text>
  <text x="70" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">شبكة مأرب الذكية • Starlink</text>
  <rect x="290" y="18" width="95" height="28" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="338" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">بوابة t.net</text>

  <!-- Hero Card -->
  <rect x="16" y="80" width="368" height="210" rx="20" fill="url(#heroGrad)" />
  <text x="36" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#bfdbfe">محطة مأرب — ستارلينك فضائي</text>
  <text x="36" y="145" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff">أهلاً بك في طلقة نت 🚀</text>
  <text x="36" y="168" font-family="system-ui, sans-serif" font-size="12" fill="#e0f2fe">إنترنت فائق السرعة وبث مباشر ثابت عبر الأقمار الصناعية</text>
  
  <rect x="32" y="195" width="336" height="44" rx="14" fill="#ffffff" />
  <text x="200" y="222" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">الدخول إلى الإنترنت (t.net)</text>
  
  <rect x="32" y="247" width="164" height="32" rx="10" fill="rgba(255,255,255,0.2)" />
  <text x="114" y="267" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">فحص رصيد الكرت</text>

  <rect x="204" y="247" width="164" height="32" rx="10" fill="rgba(255,255,255,0.2)" />
  <text x="286" y="267" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">الرابط البديل (IP)</text>

  <!-- Notice -->
  <rect x="16" y="304" width="368" height="52" rx="14" fill="#fffbeb" stroke="#fef3c7" />
  <text x="32" y="326" font-family="system-ui, sans-serif" font-size="10.5" fill="#92400e" font-weight="bold">ملاحظة للمشتركين:</text>
  <text x="32" y="342" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350f">أزرار بوابة الدخول تعمل فقط عند الاتصال بشبكة واي فاي طلقة نت.</text>

  <!-- Quick Grid -->
  <rect x="16" y="370" width="178" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0" />
  <circle cx="42" cy="396" r="14" fill="#eff6ff" />
  <text x="32" y="430" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">فحص السرعة</text>
  <text x="32" y="448" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">قياس حقيقي لاستجابة البينج</text>
  <text x="32" y="468" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">ابدأ الفحص ←</text>

  <rect x="206" y="370" width="178" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0" />
  <circle cx="232" cy="396" r="14" fill="#fef3c7" />
  <text x="222" y="430" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">مسابقة الولاء</text>
  <text x="222" y="448" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">10 كروت ← عجلة الحظ</text>
  <text x="222" y="468" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#d97706">المرحلة 3 ←</text>

  <!-- PWA Install Banner -->
  <rect x="16" y="495" width="368" height="115" rx="18" fill="url(#pwaGrad)" />
  <text x="36" y="525" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">تثبيت تطبيق طلقة نت PWA</text>
  <text x="36" y="545" font-family="system-ui, sans-serif" font-size="11" fill="#e0f2fe">تطبيق خفيف وسريع يعمل بدون شريط المتصفح بدون إنترنت</text>
  <rect x="36" y="562" width="328" height="34" rx="10" fill="#ffffff" />
  <text x="200" y="584" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">تثبيت على الشاشة الرئيسية</text>

  <!-- Bottom Nav -->
  <rect x="0" y="736" width="400" height="64" fill="#ffffff" stroke="#e2e8f0" />
  <text x="40" y="772" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">الرئيسية</text>
  <text x="120" y="772" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">الباقات</text>
  <text x="200" y="772" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">الاستراحة</text>
  <text x="280" y="772" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">المباريات</text>
  <text x="360" y="772" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">المزيد</text>

  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
</svg>
