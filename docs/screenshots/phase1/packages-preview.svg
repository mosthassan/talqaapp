  <text x="40" y="244" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">2700 ميجا (2.7GB)</text>
  <text x="210" y="228" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">السرعة</text>
  <text x="210" y="244" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">حتى 50 Mbps</text>

  <!-- Buttons -->
  <rect x="28" y="270" width="180" height="34" rx="10" fill="#2563eb" />
  <text x="118" y="292" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">طلب عبر واتساب</text>
  <rect x="216" y="270" width="156" height="34" rx="10" fill="#ffffff" stroke="#cbd5e1" />
  <text x="294" y="292" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">نقاط التوزيع</text>

  <!-- Card 1000 -->
  <rect x="16" y="365" width="368" height="235" rx="18" fill="#ffffff" stroke="#cbd5e1" />
  <text x="28" y="415" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0f172a">كرت 1000 ريال</text>
  <text x="28" y="439" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#2563eb">1000 <tspan font-size="12" fill="#64748b">ريال يمني</tspan></text>
  <rect x="28" y="450" width="344" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="40" y="468" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">الرصيد</text>
  <text x="40" y="484" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">4500 ميجا (4.5GB)</text>
  <text x="210" y="468" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">السرعة</text>
  <text x="210" y="484" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">حتى 70 Mbps</text>

  <rect x="28" y="510" width="180" height="34" rx="10" fill="#2563eb" />
  <text x="118" y="532" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">طلب عبر واتساب</text>
  <rect x="216" y="510" width="156" height="34" rx="10" fill="#ffffff" stroke="#cbd5e1" />
  <text x="294" y="532" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">نقاط التوزيع</text>

  <!-- Bottom Nav -->
  <rect x="0" y="736" width="400" height="64" fill="#ffffff" stroke="#e2e8f0" />
  <text x="40" y="772" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">الرئيسية</text>
  <text x="120" y="772" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">الباقات</text>
  <text x="200" y="772" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">الاستراحة</text>
  <text x="280" y="772" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">المباريات</text>
  <text x="360" y="772" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">المزيد</text>
</svg>
