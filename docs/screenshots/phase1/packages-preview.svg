<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <rect width="400" height="800" fill="#f8fafc" />
  <!-- Header -->
  <rect width="400" height="64" fill="#ffffff" stroke="#e2e8f0" />
  <text x="20" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0f172a">باقات وفئات الكروت 💳</text>
  <text x="20" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">أسعار رسمية بالريال اليمني عبر ستارلينك</text>

  <!-- Filter Chips -->
  <rect x="20" y="76" width="70" height="26" rx="13" fill="#2563eb" />
  <text x="55" y="93" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">الكل</text>
  <rect x="98" y="76" width="76" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="136" y="93" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">الساعات</text>
  <rect x="182" y="76" width="76" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="220" y="93" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">اليومية</text>
  <rect x="266" y="76" width="84" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="308" y="93" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">شهرية VIP</text>

  <!-- Card 500 -->
  <rect x="16" y="115" width="368" height="235" rx="18" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="28" y="128" width="80" height="20" rx="10" fill="#fef3c7" stroke="#fde68a" />
  <text x="68" y="142" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">الأكثر طلباً 🔥</text>
  <text x="28" y="172" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0f172a">كرت 500 ريال</text>
  <text x="28" y="196" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#2563eb">500 <tspan font-size="12" fill="#64748b">ريال يمني</tspan></text>

  <!-- Specs grid -->
  <rect x="28" y="210" width="344" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
