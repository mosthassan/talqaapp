<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#F8F8F7"/>
  <!-- Status Bar -->
  <rect width="390" height="44" fill="#ffffff"/>
  <text x="35" y="28" font-family="system-ui" font-size="12" font-weight="bold" fill="#1C1917">9:41</text>
  <circle cx="340" cy="24" r="3" fill="#10B981"/>
  <text x="350" y="28" font-family="system-ui" font-size="11" fill="#57534E">5G</text>

  <!-- Header -->
  <rect y="44" width="390" height="60" fill="#ffffff" stroke="#E7E5E4" stroke-width="1"/>
  <text x="360" y="78" font-family="system-ui" font-size="16" font-weight="bold" fill="#1C1917" text-anchor="end">طلقة نت • فحص السرعة</text>
  <rect x="20" y="60" width="85" height="26" rx="13" fill="#FDF7E7" stroke="#EEDAA2" stroke-width="1"/>
  <text x="62" y="77" font-family="system-ui" font-size="11" font-weight="bold" fill="#8C6311" text-anchor="middle">مباشر CF</text>

  <!-- Speed Meter Dial -->
  <rect x="20" y="120" width="350" height="340" rx="24" fill="#ffffff" stroke="#E7E5E4" stroke-width="1"/>
  <circle cx="195" cy="240" r="85" fill="none" stroke="#F5F5F4" stroke-width="12"/>
  <circle cx="195" cy="240" r="85" fill="none" stroke="#C59424" stroke-width="12" stroke-dasharray="534" stroke-dashoffset="160" stroke-linecap="round" transform="rotate(-90 195 240)"/>
  <text x="195" y="240" font-family="system-ui" font-size="44" font-weight="900" fill="#1C1917" text-anchor="middle">74.8</text>
  <text x="195" y="265" font-family="system-ui" font-size="13" font-weight="bold" fill="#0284C7" text-anchor="middle">Mbps (تنزيل)</text>

  <!-- Sub Metrics Grid -->
  <rect x="40" y="360" width="310" height="60" rx="16" fill="#F8F8F7" stroke="#E7E5E4" stroke-width="1"/>
  <text x="90" y="385" font-family="system-ui" font-size="10" fill="#78716C" text-anchor="middle">الرفع</text>
  <text x="90" y="405" font-family="system-ui" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">24.2 Mbps</text>
  <line x1="145" y1="370" x2="145" y2="410" stroke="#E7E5E4"/>
  <text x="195" y="385" font-family="system-ui" font-size="10" fill="#78716C" text-anchor="middle">البينج</text>
  <text x="195" y="405" font-family="system-ui" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">38 ms</text>
  <line x1="245" y1="370" x2="245" y2="410" stroke="#E7E5E4"/>
  <text x="295" y="385" font-family="system-ui" font-size="10" fill="#78716C" text-anchor="middle">التذبذب</text>
  <text x="295" y="405" font-family="system-ui" font-size="13" font-weight="bold" fill="#1C1917" text-anchor="middle">4.1 ms</text>

  <!-- History Sparkline -->
  <rect x="20" y="480" width="350" height="90" rx="20" fill="#ffffff" stroke="#E7E5E4" stroke-width="1"/>
  <text x="350" y="505" font-family="system-ui" font-size="12" font-weight="bold" fill="#1C1917" text-anchor="end">سجل آخر 10 فحوصات</text>
  <polyline fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" points="40,550 75,540 110,545 145,530 180,535 215,520 250,528 285,515 320,518 350,510"/>

  <!-- Bottom CTA -->
  <rect x="20" y="590" width="350" height="48" rx="24" fill="#C59424"/>
  <text x="195" y="620" font-family="system-ui" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">إعادة الفحص المباشر ↺</text>

  <!-- Bottom Nav -->
  <rect y="760" width="390" height="84" fill="#ffffff" stroke="#E7E5E4" stroke-width="1"/>
  <text x="330" y="800" font-family="system-ui" font-size="10" fill="#78716C" text-anchor="middle">الرئيسية</text>
  <text x="260" y="800" font-family="system-ui" font-size="10" fill="#78716C" text-anchor="middle">الباقات</text>
  <text x="195" y="800" font-family="system-ui" font-size="10" fill="#78716C" text-anchor="middle">الاستراحة</text>
  <text x="130" y="800" font-family="system-ui" font-size="10" fill="#78716C" text-anchor="middle">المباشر</text>
  <text x="60" y="800" font-family="system-ui" font-size="10" font-weight="bold" fill="#C59424" text-anchor="middle">السرعة</text>
</svg>
